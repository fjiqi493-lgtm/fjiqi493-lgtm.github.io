<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JASON · 工业设计作品集</title>
    <meta name="description" content="极简高级工业设计作品集 —— 消费电子、家居与工具的产品定义、结构与量产落地。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=20260904b" />
    <script>
      /* 图片加载优化：在 HTML 解析阶段就发起 site.json 请求，与 css/js 并行下载，
         省掉「等 JS 下载完才开始请求数据」的一整轮 RTT，首屏图片因此更早开始加载。
         请求参数与页面脚本完全一致，不改变任何缓存或新鲜度行为。 */
      window.__sitePromise = fetch('./site.json?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
        .catch(function () { return null; });
    </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="JASON" />
  <meta property="og:title" content="JASON · 工业设计作品集" />
  <meta property="og:description" content="消费电子、家居与工具的工业设计作品集 —— 产品定义、CMF 与量产落地。" />
  <meta property="og:image" content="og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" id="brand" href="index.html">JASON</a>
        <nav class="nav" id="nav"></nav>
        <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14" /></svg>
        </button>
        <div class="header-actions">
          <button class="lang-toggle" id="lang-toggle" type="button"><span data-lang="zh" class="on">中</span><i>/</i><span data-lang="en">EN</span></button>
          <a class="admin-link" id="admin-link" href="admin.html">管理</a>
        </div>
      </div>
    </header>

    <main>
      <!-- Hero -->
      <section class="home-hero">
        <div class="wrap home-hero-grid">
          <div class="home-hero-content reveal">
            <div class="avatar" id="avatar"></div>
            <div class="en" id="home-kicker" style="margin-top:24px"></div>
            <h1 class="home-name" id="home-name"></h1>
            <div class="home-title" id="home-title"></div>
            <p class="home-bio" id="home-bio"></p>
            <div class="home-cta">
              <a class="btn btn-primary" id="cta-works" href="works.html">查看作品</a>
              <a class="btn btn-ghost" id="cta-contact" href="#contact">合作联系</a>
            </div>
          </div>
          <div class="home-visual reveal">
            <div class="visual-frame">
              <img id="home-visual-img" alt="代表作" />
            </div>
          </div>
        </div>
      </section>

      <!-- 精选作品 -->
      <section class="section">
        <div class="wrap">
          <div class="section-head reveal">
            <div>
              <div class="en" id="s-works-en">SELECTED WORKS</div>
              <h2 id="s-works-title">精选作品</h2>
            </div>
            <a class="view-all" href="works.html">查看全部 →</a>
          </div>
          <div class="works-grid" id="works-grid"></div>
        </div>
      </section>

      <!-- 项目过程 -->
      <section class="section" id="process" style="background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow:hidden;">
        <div class="wrap">
          <div class="section-head reveal">
            <div>
              <div class="en" id="s-process-en">PROJECT PROCESS</div>
              <h2 id="s-process-title">项目过程</h2>
            </div>
          </div>
        </div>
        <div class="process-stage reveal" id="process-stage">
          <div class="process-track" id="process-track"></div>
        </div>
        <div class="wrap">
          <div class="process-software reveal" id="process-software"></div>
        </div>
      </section>

      <!-- 设计理念 -->
      <section class="section" id="philosophy" style="background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);">
        <div class="wrap">
          <div class="section-head reveal">
            <div>
              <div class="en" id="philo-en">PHILOSOPHY</div>
              <h2 id="philo-title">设计理念</h2>
            </div>
          </div>
          <div class="philosophy-grid reveal" id="philosophy-grid"></div>
          <div class="philo-quote reveal" id="philo-quote"></div>
        </div>
      </section>

      <!-- 联系 -->
      <section class="section" id="contact">
        <div class="wrap contact-wrap">
          <div class="contact-header reveal">
            <div class="en" id="s-contact-en">CONTACT</div>
            <h2 id="s-contact-title">合作联系</h2>
          </div>
          <div class="contact-body reveal">
            <a class="contact-email" id="contact-email" href="#"></a>
            <p class="contact-note" id="contact-note"></p>
            <div id="socials"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-inner">
          <div>
            <div class="footer-brand" id="footer-brand"></div>
            <p class="footer-desc" id="footer-desc"></p>
            <div class="footer-socials" id="footer-socials"></div>
          </div>
          <div>
            <div class="footer-col-title" id="f-col-nav">导航</div>
            <div class="footer-links" id="footer-nav-links"></div>
          </div>
          <div>
            <div class="footer-col-title" id="f-col-works">作品</div>
            <div class="footer-links" id="footer-works"></div>
          </div>
        </div>
        <div class="footer-line"></div>
        <div class="footer-bottom">
          <span id="footer-copy"></span>
          <span id="footer-seo"></span>
        </div>
      </div>
    </footer>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
      <button class="close" aria-label="关闭">×</button>
      <img id="lightbox-img" src="" alt="" />
    </div>

    <script src="js/api.js?v=20260904b"></script>
    <script src="js/home.js?v=20260904b"></script>
  </body>
</html>
