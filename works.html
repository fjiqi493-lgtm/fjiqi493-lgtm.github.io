<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品 · JASON 工业设计作品集</title>
    <meta name="description" content="工业设计作品列表 —— 消费电子、家居、工具、医疗辅具与可穿戴。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" id="brand" href="index.html">JASON</a>
        <nav class="nav" id="nav"></nav>
        <div class="header-actions">
          <a class="admin-link" href="admin.html">管理</a>
        </div>
      </div>
    </header>

    <main>
      <section class="section" style="padding-top: 90px;">
        <div class="wrap">
          <div class="section-head reveal">
            <div>
              <div class="en" id="s-all-en">WORKS</div>
              <h2 id="s-all-title">全部作品</h2>
            </div>
            <span class="view-all" id="count"></span>
          </div>
          <div class="works-grid" id="works-grid"></div>
          <div id="empty" style="display:none; padding:60px 0; text-align:center; color:var(--muted);">暂无作品，管理员可在后台添加。</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-inner">
          <div>
            <div class="footer-brand" id="footer-brand"></div>
            <p class="footer-desc" id="footer-desc"></p>
            <div class="footer-socials" id="footer-socials"></div>
          </div>
          <div>
            <div class="footer-col-title" id="f-col-nav">导航</div>
            <div class="footer-links" id="footer-nav-links"></div>
          </div>
          <div>
            <div class="footer-col-title" id="f-col-works">作品</div>
            <div class="footer-links" id="footer-works"></div>
          </div>
          <div>
            <div class="footer-col-title" id="f-col-contact">联系</div>
            <div class="footer-contact-info">
              <a class="f-email" id="f-email" href="#"></a>
              <span class="f-note" id="f-note"></span>
            </div>
          </div>
        </div>
        <div class="footer-line"></div>
        <div class="footer-bottom">
          <span id="footer-copy"></span>
          <span id="footer-seo"></span>
        </div>
      </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/works.js"></script>
  </body>
</html>
