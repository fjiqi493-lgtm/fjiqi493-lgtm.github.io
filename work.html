    <script>
      /* 图片加载优化：HTML 解析阶段即发起 site.json 请求，与 css/js 并行下载，
         省掉一轮 RTT，作品大图因此更早开始加载。请求参数与页面脚本一致。 */
      window.__sitePromise = fetch('./site.json?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
        .catch(function () { return null; });
    </script>
