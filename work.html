<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品详情 · JASON 工业设计作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" id="brand" href="index.html">JASON</a>
        <nav class="nav" id="nav"></nav>
        <div class="header-actions">
          <a class="admin-link" href="admin.html">管理</a>
        </div>
      </div>
    </header>

    <main>
      <section class="detail-hero">
        <div class="wrap">
          <a class="detail-back" href="works.html">← 返回作品列表</a>
          <div class="reveal">
            <h1 class="detail-title" id="d-title"></h1>
            <div class="detail-cat" id="d-cat"></div>
          </div>
          <div class="detail-cover reveal" id="d-cover">
            <img id="d-cover-img" src="" alt="" />
          </div>
        </div>
      </section>

      <section>
        <div class="wrap detail-body">
          <div class="reveal">
            <div class="en" style="margin-bottom:14px;">PROJECT</div>
            <div class="detail-desc" id="d-desc"></div>
            <div class="gallery" id="d-gallery"></div>
          </div>
          <aside class="detail-side reveal">
            <div class="block">
              <div class="en">概览</div>
              <div class="params" id="d-overview"></div>
            </div>
            <div class="block">
              <div class="en">参数</div>
              <div class="params" id="d-params"></div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-inner">
          <div>
            <div class="footer-brand" id="footer-brand"></div>
            <p class="footer-desc" id="footer-desc"></p>
            <div class="footer-socials" id="footer-socials"></div>
          </div>
          <div>
            <div class="footer-col-title" id="f-col-nav">导航</div>
            <div class="footer-links" id="footer-nav-links"></div>
          </div>
          <div>
            <div class="footer-col-title">作品</div>
            <div class="footer-links" id="footer-works"></div>
          </div>
          <div>
            <div class="footer-col-title">联系</div>
            <div class="footer-contact-info">
              <a class="f-email" id="f-email" href="#"></a>
              <span class="f-note" id="f-note"></span>
            </div>
          </div>
        </div>
        <div class="footer-line"></div>
        <div class="footer-bottom">
          <span id="footer-copy"></span>
          <span id="footer-seo"></span>
        </div>
      </div>
    </footer>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
      <button class="close" aria-label="关闭">×</button>
      <img id="lightbox-img" src="" alt="" />
    </div>

    <script src="js/api.js"></script>
    <script src="js/work.js"></script>
  </body>
</html>
